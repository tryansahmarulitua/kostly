<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontrak Sewa - Kostly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/neobrutalism.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('contracts')}"></div>

        <main class="col-md-10 p-4 p-lg-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <div class="text-secondary small fw-bold">PERJANJIAN SEWA</div>
                    <h1 class="h3 fw-bold">Kontrak Sewa</h1>
                    <p class="text-secondary mb-0">Kelola masa sewa penghuni dan status kontrak.</p>
                </div>
                <a th:href="@{/contracts/new}" class="btn btn-primary">+ Buat Kontrak</a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card p-3 p-md-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Penghuni</th>
                            <th>Kamar</th>
                            <th>Mulai</th>
                            <th>Berakhir</th>
                            <th>Harga / bulan</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="contract : ${contracts}">
                            <td class="fw-semibold" th:text="${contract.tenant.fullName}"></td>
                            <td><span class="badge bg-light text-dark border" th:text="${contract.room.roomNumber}"></span></td>
                            <td th:text="${#temporals.format(contract.startDate, 'dd-MM-yyyy')}"></td>
                            <td th:text="${#temporals.format(contract.endDate, 'dd-MM-yyyy')}"></td>
                            <td th:text="${'Rp ' + #numbers.formatDecimal(contract.monthlyPrice, 0, 'POINT', 0, 'COMMA')}"></td>
                            <td>
                                <span th:if="${contract.status.name() == 'ACTIVE'}" class="badge text-bg-success">Aktif</span>
                                <span th:if="${contract.status.name() == 'ENDED'}" class="badge text-bg-secondary">Berakhir</span>
                            </td>
                            <td>
                                <form th:if="${contract.status.name() == 'ACTIVE'}" method="post" th:action="@{/contracts/{id}/end(id=${contract.id})}" onsubmit="return confirm('Akhiri kontrak sewa ini?')">
                                    <button class="btn btn-sm btn-outline-danger">Akhiri</button>
                                </form>
                                <span th:if="${contract.status.name() == 'ENDED'}" class="text-secondary small fw-semibold">Selesai</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contracts)}">
                            <td colspan="7" class="text-center text-secondary py-5">Belum ada kontrak sewa.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
