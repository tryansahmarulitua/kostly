<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' • Kostly'">Kostly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/neobrutalism.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg border-bottom border-2 border-dark" style="background:var(--main)">
  <div class="container-fluid px-4"><a class="navbar-brand fw-bold text-dark" th:href="@{/dashboard}">Kostly<span style="color:#000">.</span></a>
  <div class="d-flex align-items-center gap-3 text-dark"><span class="small fw-bold">Sistem Manajemen Kost</span>
  <form th:action="@{/logout}" method="post"><button class="btn btn-sm btn-outline-dark bg-white">Keluar</button></form></div></div>
</nav>
<aside th:fragment="sidebar(active)"
       class="col-md-2 d-none d-md-block bg-white border-end border-2 border-dark min-vh-100 p-3">

    <div class="text-uppercase text-dark small fw-bold mb-3">
        Menu Utama
    </div>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'dashboard'} ? ' active-link' : ''"
       th:href="@{/dashboard}">
        ▦ &nbsp; Dashboard
    </a>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'rooms'} ? ' active-link' : ''"
       th:href="@{/rooms}">
        ▤ &nbsp; Manajemen Kamar
    </a>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'tenants'} ? ' active-link' : ''"
       th:href="@{/tenants}">
        ♙ &nbsp; Penghuni
    </a>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'contracts'} ? ' active-link' : ''"
       th:href="@{/contracts}">
        ▣ &nbsp; Kontrak Sewa
    </a>

    <div class="text-uppercase text-dark small fw-bold mt-4 mb-2">
        Keuangan
    </div>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'invoices'} ? ' active-link' : ''"
       th:href="@{/invoices}">
        💳 &nbsp; Tagihan & Pembayaran
    </a>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'reports'} ? ' active-link' : ''"
       th:href="@{/reports}">
        ◷ &nbsp; Laporan
    </a>
</aside>
</body></html>
