<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' • Kostly'">Kostly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/neobrutalism.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand border-bottom border-2 border-dark fixed-top" style="background:var(--main)">
  <div class="container-fluid px-3 px-md-4">
    <div class="d-flex align-items-center gap-2">
      <button id="sidebarToggle" type="button" class="btn btn-sm btn-outline-dark bg-white d-inline-flex align-items-center justify-content-center" style="width:34px; height:34px; font-weight:800; font-size:1.1rem; line-height:1;" title="Menu Navigasi">
        ☰
      </button>
      <a class="navbar-brand fw-bold text-dark mb-0 fs-4" th:href="@{/dashboard}">Kostly<span style="color:#000">.</span></a>
    </div>
    <div class="d-flex align-items-center gap-2 gap-md-3 text-dark">
      <span class="small fw-bold d-none d-sm-inline">Sistem Manajemen Kost</span>
      <form th:action="@{/logout}" method="post" class="mb-0">
        <button class="btn btn-sm btn-outline-dark bg-white">Keluar</button>
      </form>
    </div>
  </div>
</nav>

<aside th:fragment="sidebar(active)"
       id="appSidebar"
       class="app-sidebar col-md-2 bg-white border-end border-2 border-dark min-vh-100 p-3">

    <script>
        if (window.innerWidth >= 768 && localStorage.getItem('kostly_sidebar_minimized') === 'true') {
            document.body.classList.add('sidebar-minimized');
        }
    </script>

    <div class="d-flex align-items-center justify-content-between mb-3 sidebar-section">
        <span class="text-uppercase text-dark small fw-bold sidebar-title">Menu Utama</span>
        <button id="sidebarCollapseBtn" type="button" class="btn btn-sm btn-outline-dark bg-white p-0 d-flex align-items-center justify-content-center" style="width:24px; height:24px; font-size:10px;" title="Minimize sidebar">
            ◀
        </button>
    </div>
    <hr class="sidebar-divider d-none my-2 border-dark border-2">

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'dashboard'} ? ' active-link' : ''"
       th:href="@{/dashboard}"
       title="Dashboard">
        <span class="nav-icon">▦</span><span class="nav-text">&nbsp; Dashboard</span>
    </a>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'rooms'} ? ' active-link' : ''"
       th:href="@{/rooms}"
       title="Manajemen Kamar">
        <span class="nav-icon">▤</span><span class="nav-text">&nbsp; Manajemen Kamar</span>
    </a>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'tenants'} ? ' active-link' : ''"
       th:href="@{/tenants}"
       title="Penghuni">
        <span class="nav-icon">♙</span><span class="nav-text">&nbsp; Penghuni</span>
    </a>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'contracts'} ? ' active-link' : ''"
       th:href="@{/contracts}"
       title="Kontrak Sewa">
        <span class="nav-icon">▣</span><span class="nav-text">&nbsp; Kontrak Sewa</span>
    </a>

    <div class="text-uppercase text-dark small fw-bold mt-4 mb-2 sidebar-title">
        Keuangan
    </div>
    <hr class="sidebar-divider d-none my-3 border-dark border-2">

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'invoices'} ? ' active-link' : ''"
       th:href="@{/invoices}"
       title="Tagihan & Pembayaran">
        <span class="nav-icon">💳</span><span class="nav-text">&nbsp; Tagihan & Pembayaran</span>
    </a>

    <a class="nav-link rounded px-3 py-2 mb-1"
       th:classappend="${active == 'reports'} ? ' active-link' : ''"
       th:href="@{/reports}"
       title="Laporan">
        <span class="nav-icon">◷</span><span class="nav-text">&nbsp; Laporan</span>
    </a>

    <script>
        (function () {
            const STORAGE_KEY = 'kostly_sidebar_minimized';

            function isMobile() {
                return window.innerWidth < 768;
            }

            function ensureBackdrop() {
                let backdrop = document.getElementById('sidebarBackdrop');
                if (!backdrop) {
                    backdrop = document.createElement('div');
                    backdrop.id = 'sidebarBackdrop';
                    backdrop.className = 'sidebar-backdrop';
                    document.body.appendChild(backdrop);
                    backdrop.addEventListener('click', closeMobileSidebar);
                }
                return backdrop;
            }

            function updateIcons() {
                const sideBtn = document.getElementById('sidebarCollapseBtn');
                if (!sideBtn) return;
                if (isMobile()) {
                    sideBtn.textContent = '✕';
                    sideBtn.title = 'Tutup menu';
                } else {
                    const isMin = document.body.classList.contains('sidebar-minimized');
                    sideBtn.textContent = isMin ? '▶' : '◀';
                    sideBtn.title = isMin ? 'Perbesar sidebar' : 'Minimize sidebar';
                }
            }

            function toggle() {
                if (isMobile()) {
                    ensureBackdrop();
                    document.body.classList.toggle('sidebar-open');
                } else {
                    const isMin = document.body.classList.toggle('sidebar-minimized');
                    localStorage.setItem(STORAGE_KEY, isMin ? 'true' : 'false');
                    updateIcons();
                }
            }

            function closeMobileSidebar() {
                document.body.classList.remove('sidebar-open');
            }

            ensureBackdrop();
            updateIcons();
            window.addEventListener('resize', function () {
                if (!isMobile()) closeMobileSidebar();
                updateIcons();
            });

            const navBtn = document.getElementById('sidebarToggle');
            const sideBtn = document.getElementById('sidebarCollapseBtn');
            if (navBtn) navBtn.onclick = toggle;
            if (sideBtn) {
                sideBtn.onclick = function () {
                    if (isMobile()) closeMobileSidebar();
                    else toggle();
                };
            }

            document.querySelectorAll('.app-sidebar .nav-link').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (isMobile()) closeMobileSidebar();
                });
            });
        })();
    </script>
</aside>
</body></html>
