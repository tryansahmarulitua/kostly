<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manajemen Kamar • Kostly</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7f5;color:#20352d}.active-link{background:#eaf3e9;color:#173f35!important;font-weight:600}.panel{border:0;border-radius:16px}</style></head><body>
<div th:replace="~{fragments/layout :: navbar}"></div><div class="container-fluid"><div class="row"><div th:replace="~{fragments/layout :: sidebar('rooms')}"></div><main class="col-md-10 p-4 p-lg-5">
<div class="d-flex justify-content-between align-items-center mb-4"><div><div class="text-secondary small">INVENTARIS</div><h1 class="h3 fw-bold">Manajemen Kamar</h1><p class="text-secondary mb-0">Kelola nomor, tipe, harga, dan status kamar.</p></div><a class="btn text-white" style="background:#173f35" th:href="@{/rooms/new}">+ Tambah Kamar</a></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="card panel shadow-sm p-3 p-md-4"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Nomor</th><th>Tipe</th><th>Harga / bulan</th><th>Status</th><th class="text-end">Aksi</th></tr></thead><tbody>
<tr th:each="room : ${rooms}"><td class="fw-semibold" th:text="${room.roomNumber}"></td><td th:text="${room.type}"></td><td th:text="${'Rp ' + #numbers.formatDecimal(room.price, 0, 'POINT', 0, 'COMMA')}"></td>
<td><span class="badge rounded-pill text-bg-success" th:if="${room.status.name() == 'AVAILABLE'}">Tersedia</span><span class="badge rounded-pill text-bg-primary" th:if="${room.status.name() == 'OCCUPIED'}">Terisi</span><span class="badge rounded-pill text-bg-warning" th:if="${room.status.name() == 'MAINTENANCE'}">Perawatan</span></td>
<td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/rooms/{id}/edit(id=${room.id})}">Edit</a> <form class="d-inline" method="post" th:action="@{/rooms/{id}/delete(id=${room.id})}" onsubmit="return confirm('Hapus kamar ini?')"><button class="btn btn-sm btn-outline-danger">Hapus</button></form></td></tr>
<tr th:if="${#lists.isEmpty(rooms)}"><td colspan="5" class="text-center text-secondary py-5">Belum ada data kamar. Klik “Tambah Kamar” untuk memulai.</td></tr>
</tbody></table></div></div></main></div></div></body></html>
