<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form Kamar • Kostly</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7f5;color:#20352d}.active-link{background:#eaf3e9;color:#173f35!important;font-weight:600}.panel{border:0;border-radius:16px}</style></head><body>
<div th:replace="~{fragments/layout :: navbar}"></div><div class="container-fluid"><div class="row"><div th:replace="~{fragments/layout :: sidebar('rooms')}"></div><main class="col-md-10 p-4 p-lg-5"><div class="mb-4"><a th:href="@{/rooms}" class="text-decoration-none text-secondary">← Kembali ke kamar</a><h1 class="h3 fw-bold mt-3" th:text="${room.id == null ? 'Tambah Kamar' : 'Edit Kamar'}"></h1></div>
<div class="card panel shadow-sm p-4" style="max-width:760px"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<form method="post" th:object="${room}" th:action="${room.id == null ? '/rooms' : '/rooms/' + room.id + '/edit'}">
<div class="row g-3"><div class="col-md-6"><label class="form-label">Nomor Kamar</label><input class="form-control" th:field="*{roomNumber}" placeholder="Contoh: A-01"><div class="text-danger small" th:errors="*{roomNumber}"></div></div>
<div class="col-md-6"><label class="form-label">Tipe Kamar</label><input class="form-control" th:field="*{type}" placeholder="Contoh: Standard / Deluxe"><div class="text-danger small" th:errors="*{type}"></div></div>
<div class="col-md-6"><label class="form-label">Harga per Bulan (Rp)</label><input class="form-control" type="number" min="0" step="1000" th:field="*{price}" placeholder="1000000"><div class="text-danger small" th:errors="*{price}"></div></div>
<div class="col-md-6"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option value="AVAILABLE">Tersedia</option><option value="OCCUPIED">Terisi</option><option value="MAINTENANCE">Perawatan</option></select></div>
<div class="col-12"><label class="form-label">Deskripsi</label><textarea class="form-control" rows="3" th:field="*{description}" placeholder="Fasilitas atau catatan kamar (opsional)"></textarea></div></div>
<div class="d-flex gap-2 mt-4"><button class="btn text-white" style="background:#173f35">Simpan Kamar</button><a class="btn btn-light" th:href="@{/rooms}">Batal</a></div></form></div></main></div></div></body></html>
