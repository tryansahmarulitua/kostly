<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buat Tagihan - Kostly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/neobrutalism.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('invoices')}"></div>

        <main class="col-md-10 p-4 p-lg-5">
            <a th:href="@{/invoices}" class="text-dark fw-bold text-decoration-none">← Kembali ke tagihan</a>
            <h1 class="h3 fw-bold mt-3 mb-4">Buat Tagihan Baru</h1>

            <div class="card p-4" style="max-width:760px">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div th:if="${#lists.isEmpty(contracts)}" class="alert alert-warning">
                    Tidak ada kontrak sewa aktif. 
                    <a th:href="@{/contracts/new}">Buat kontrak sewa terlebih dahulu</a>.
                </div>

                <form method="post" th:action="@{/invoices}" th:object="${invoiceForm}" th:if="${!#lists.isEmpty(contracts)}">
                    <div class="mb-3">
                        <label for="contractId" class="form-label">Pilih Kontrak Sewa (Penghuni & Kamar)</label>
                        <select id="contractId" class="form-select" th:field="*{contractId}" required>
                            <option value="">-- Pilih Kontrak Aktif --</option>
                            <option th:each="c : ${contracts}"
                                    th:value="${c.id}"
                                    th:attr="data-price=${c.monthlyPrice}, data-room=${c.room.roomNumber}"
                                    th:text="${c.tenant.fullName + ' - Kamar ' + c.room.roomNumber + ' (Rp ' + #numbers.formatDecimal(c.monthlyPrice, 0, 'POINT', 0, 'COMMA') + ')'}">
                            </option>
                        </select>
                        <div class="text-danger small fw-semibold" th:if="${#fields.hasErrors('contractId')}" th:errors="*{contractId}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Keterangan Tagihan</label>
                        <input type="text" id="description" class="form-control" th:field="*{description}"
                               placeholder="Contoh: Sewa Kamar 101 - November 2026" required>
                        <div class="text-danger small fw-semibold" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Jumlah Tagihan (Rp)</label>
                        <input type="number" step="1000" min="0" id="amount" class="form-control" th:field="*{amount}" required>
                        <div class="text-danger small fw-semibold" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="issueDate" class="form-label">Tanggal Tagihan</label>
                            <input type="date" id="issueDate" class="form-control" th:field="*{issueDate}" required>
                            <div class="text-danger small fw-semibold" th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="dueDate" class="form-label">Jatuh Tempo</label>
                            <input type="date" id="dueDate" class="form-control" th:field="*{dueDate}" required>
                            <div class="text-danger small fw-semibold" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Simpan Tagihan</button>
                        <a th:href="@{/invoices}" class="btn btn-light">Batal</a>
                    </div>
                </form>

                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        const contractSelect = document.getElementById('contractId');
                        const amountInput = document.getElementById('amount');
                        const descInput = document.getElementById('description');

                        if (!contractSelect || !amountInput) return;

                        contractSelect.addEventListener('change', function () {
                            const option = contractSelect.options[contractSelect.selectedIndex];
                            const price = option ? option.dataset.price : '';
                            const room = option ? option.dataset.room : '';

                            if (price) {
                                amountInput.value = price;
                            }
                            if (room && !descInput.value) {
                                const now = new Date();
                                const monthName = now.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
                                descInput.value = 'Sewa Kamar ' + room + ' - ' + monthName;
                            }
                        });
                    });
                </script>
            </div>
        </main>
    </div>
</div>
</body>
</html>
