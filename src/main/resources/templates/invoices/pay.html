<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catat Pembayaran - Kostly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7f5; color: #20352d; }
        .active-link { background: #eaf3e9; color: #173f35 !important; font-weight: 600; }
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('invoices')}"></div>

        <main class="col-md-10 p-4 p-lg-5">
            <a th:href="@{/invoices}" class="text-secondary text-decoration-none">← Kembali ke tagihan</a>
            <h1 class="h3 fw-bold mt-3 mb-4">Catat Pembayaran</h1>

            <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width:760px">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Ringkasan Tagihan -->
                <div class="p-3 mb-4 rounded-3 bg-light border">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-secondary small">RINCIAN TAGIHAN</span>
                        <span class="badge text-bg-warning">Belum Lunas</span>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="small text-secondary">Nomor Tagihan</div>
                            <div class="fw-semibold" th:text="${invoice.invoiceNumber}"></div>
                        </div>
                        <div class="col-6">
                            <div class="small text-secondary">Penghuni / Kamar</div>
                            <div class="fw-semibold" th:text="${invoice.contract.tenant.fullName + ' (Kamar ' + invoice.contract.room.roomNumber + ')'}"></div>
                        </div>
                        <div class="col-6">
                            <div class="small text-secondary">Keterangan</div>
                            <div th:text="${invoice.description}"></div>
                        </div>
                        <div class="col-6">
                            <div class="small text-secondary">Total Tagihan</div>
                            <div class="fw-bold text-success fs-5" th:text="${'Rp ' + #numbers.formatDecimal(invoice.amount, 0, 'POINT', 0, 'COMMA')}"></div>
                        </div>
                    </div>
                </div>

                <form method="post" th:action="@{/invoices/{id}/pay(id=${invoice.id})}" th:object="${paymentForm}">
                    <div class="mb-3">
                        <label for="paymentDate" class="form-label">Tanggal Pembayaran</label>
                        <input type="date" id="paymentDate" class="form-control" th:field="*{paymentDate}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('paymentDate')}" th:errors="*{paymentDate}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Jumlah Pembayaran (Rp)</label>
                        <input type="number" step="1000" min="0" id="amount" class="form-control" th:field="*{amount}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="paymentMethod" class="form-label">Metode Pembayaran</label>
                        <select id="paymentMethod" class="form-select" th:field="*{paymentMethod}" required>
                            <option th:value="TRANSFER">Transfer Bank</option>
                            <option th:value="CASH">Tunai (Cash)</option>
                            <option th:value="QRIS">QRIS / E-Wallet</option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="notes" class="form-label">Catatan / Bukti Transfer (Opsional)</label>
                        <input type="text" id="notes" class="form-control" th:field="*{notes}"
                               placeholder="Contoh: Transfer via BCA ref #123456">
                    </div>

                    <button type="submit" class="btn btn-success px-4" style="background:#173f35">
                        Konfirmasi Pembayaran
                    </button>
                    <a th:href="@{/invoices}" class="btn btn-light">Batal</a>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
