<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"><head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Masuk • Kostly</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>body{
                background:#f2f5f2
            }
            .login-card{
                max-width:420px;
                border:0;
                border-radius:22px
            }
            .brand{
                color:#173f35;
                font-weight:800;
                font-size:2rem
            }
            .btn-kostly{
                background:#173f35;
                color:white
            }
            .btn-kostly:hover{
                background:#245b4c;
                color:white
            }</style></head>
    <body class="d-flex align-items-center min-vh-100"><main class="container"><div class="card login-card shadow-sm mx-auto p-4 p-md-5">
                <div class="text-center mb-4"><div class="brand">Kostly<span style="color:#9dcf83">.</span></div>
                    <p class="text-secondary mb-0">Kelola kost lebih mudah dan teratur.</p></div>
                <div th:if="${param.error}" class="alert alert-danger">Username atau password salah.</div>
                <div th:if="${param.logout}" class="alert alert-success">Kamu berhasil keluar.</div>
                <form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label">Username</label>
                        <input class="form-control form-control-lg" name="username" required autofocus placeholder="Masukkan username"></div>
                    <div class="mb-4"><label class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" name="password" required placeholder="Masukkan password"></div>
                    <button class="btn btn-kostly btn-lg w-100">Masuk ke Dashboard</button>
                </form>
                </body>
</html>
