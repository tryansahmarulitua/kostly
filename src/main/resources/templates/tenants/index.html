<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Penghuni - Kostly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #f5f7f5; color: #20352d; }
        .active-link { background: #eaf3e9; color: #173f35 !important; font-weight: 600; }
        .panel { border: 0; border-radius: 16px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('tenants')}"></div>

        <main class="col-md-10 p-4 p-lg-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <div class="text-secondary small">MANAJEMEN DATA</div>
                    <h1 class="h3 fw-bold">Data Penghuni</h1>
                    <p class="text-secondary">Kelola identitas penghuni kost.</p>
                </div>
                <a th:href="@{/tenants/new}" class="btn text-white"
                   style="background:#173f35">+ Tambah Penghuni</a>
            </div>

            <div th:if="${success}" class="alert alert-success"
                 th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <div class="card panel shadow-sm p-3 p-md-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Nama</th>
                            <th>NIK</th>
                            <th>Telepon</th>
                            <th>Email</th>
                            <th class="text-end">Aksi</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tenant : ${tenants}">
                            <td class="fw-semibold"
                                th:text="${tenant.fullName}"></td>
                            <td th:text="${tenant.nik}"></td>
                            <td th:text="${tenant.phone}"></td>
                            <td th:text="${tenant.email ?: '-'}"></td>
                            <td class="text-end text-nowrap">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{/tenants/{id}/edit(id=${tenant.id})}">
                                    Edit
                                </a>
                                <form class="d-inline" method="post"
                                      th:action="@{/tenants/{id}/delete(id=${tenant.id})}"
                                      onsubmit="return confirm('Hapus data penghuni ini?')">
                                    <button class="btn btn-sm btn-outline-danger">
                                        Hapus
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tenants)}">
                            <td colspan="5" class="text-center text-secondary py-5">
                                Belum ada data penghuni.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
