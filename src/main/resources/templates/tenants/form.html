<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Penghuni - Kostly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/neobrutalism.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('tenants')}"></div>

        <main class="col-md-10 p-4 p-lg-5">
            <a th:href="@{/tenants}" class="text-dark fw-bold text-decoration-none">
                ← Kembali ke penghuni
            </a>

            <h1 class="h3 fw-bold mt-3 mb-4"
                th:text="${tenant.id == null ? 'Tambah Penghuni' : 'Edit Penghuni'}">
            </h1>

            <div class="card p-4" style="max-width:760px">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form method="post" th:object="${tenant}"
                      th:action="${tenant.id == null ? '/tenants' : '/tenants/' + tenant.id + '/edit'}">

                    <div class="mb-3">
                        <label class="form-label">Nama Lengkap</label>
                        <input class="form-control" th:field="*{fullName}" placeholder="Nama sesuai identitas">
                        <div class="text-danger small fw-semibold" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">NIK</label>
                        <input class="form-control" th:field="*{nik}" maxlength="16" inputmode="numeric" placeholder="16 digit NIK">
                        <div class="text-danger small fw-semibold" th:errors="*{nik}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nomor Telepon</label>
                            <input class="form-control" th:field="*{phone}" placeholder="08xxxxxxxxxx">
                            <div class="text-danger small fw-semibold" th:errors="*{phone}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email (opsional)</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="nama@email.com">
                            <div class="text-danger small fw-semibold" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Alamat</label>
                        <textarea class="form-control" rows="3" th:field="*{address}" placeholder="Alamat lengkap penghuni"></textarea>
                        <div class="text-danger small fw-semibold" th:errors="*{address}"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary">Simpan Penghuni</button>
                        <a th:href="@{/tenants}" class="btn btn-light">Batal</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
